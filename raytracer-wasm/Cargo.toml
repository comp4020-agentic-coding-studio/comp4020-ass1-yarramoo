[package]
name = "raytracer-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raytracer = { path = "../raytracer" }
# Pinned exactly: must always match the wasm-bindgen-cli version installed
# locally and in CI (see .github/workflows/checks.yml), or the generated
# glue JS fails at runtime with a schema-version-mismatch error.
wasm-bindgen = "=0.2.127"
rand = "0.9.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
